spring:
  application:
    name: ehr-spring-core
  
  # Database configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ehrdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${DB_SHOW_SQL:false}

server:
  port: 8080

# Security configuration
security:
  api-key: ${API_KEY:default-api-key-change-in-production}

# In-memory payload logging configuration
logging:
  payloads:
    enabled: true
    max-size: 1000

# Cookie scanner configuration
cookie-scanner:
  python-script-path: ${COOKIE_SCANNER_SCRIPT_PATH:src/main/python/cookie_reader.py}
  timeout-seconds: 30

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
